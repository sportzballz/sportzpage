[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "daily-sports-page"
version = "0.1.0"
description = "SportzBallz Daily Sports Page — automated MLB newspaper-style static site generator"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Proprietary" }
dependencies = [
    "pydantic>=2.7",
    "jinja2>=3.1",
    "httpx>=0.27",
    "tenacity>=8.3",
    "typer>=0.12",
    "pyyaml>=6.0",
    "pytz>=2024.1",
    "jsonschema>=4.22",
    "beautifulsoup4>=4.12",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "playwright>=1.44",
    "mypy>=1.10",
    "ruff>=0.4",
    "types-pyyaml",
    "types-pytz",
    "types-beautifulsoup4",
]

[project.scripts]
daily-sports-page = "src.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src"]

# ---------------------------------------------------------------------------
# Ruff
# ---------------------------------------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "UP",  # pyupgrade
    "ANN", # type annotations
    "S",   # bandit security
    "C4",  # flake8-comprehensions
    "SIM", # flake8-simplify
]
ignore = [
    "ANN101", # missing type annotation for self
    "ANN102", # missing type annotation for cls
    "S101",   # use of assert (acceptable in tests)
    "S603",   # subprocess call without shell=True check
    "S607",   # partial executable path
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["ANN", "S"]

# ---------------------------------------------------------------------------
# MyPy
# ---------------------------------------------------------------------------
[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false
disallow_incomplete_defs = false

# ---------------------------------------------------------------------------
# Pytest
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "--cov=src --cov-report=term-missing"
