name: TDSPApp
options:
  bundleIdPrefix: com.thedailysportspage
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "16.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    DEVELOPMENT_TEAM: UN27MHU5SB
    CODE_SIGN_STYLE: Automatic
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "6"
targets:
  TDSPApp:
    type: application
    platform: iOS
    sources:
      - path: TDSPApp
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.thedailysportspage.app
        PRODUCT_NAME: TDSPApp
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: TDSPApp/Info.plist
        CODE_SIGN_ENTITLEMENTS: TDSPApp/TDSPApp.entitlements
        TARGETED_DEVICE_FAMILY: "1,2"
        SUPPORTS_MACCATALYST: NO
    scheme:
      testTargets:
        - TDSPAppTests
  TDSPAppTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: TDSPAppTests
    dependencies:
      - target: TDSPApp
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.thedailysportspage.app.tests
        GENERATE_INFOPLIST_FILE: YES
