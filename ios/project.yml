name: TDSPApp
options:
  bundleIdPrefix: com.thedailysportspage
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "16.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    DEVELOPMENT_TEAM: UN27MHU5SB
    CODE_SIGN_STYLE: Automatic
targets:
  TDSPApp:
    type: application
    platform: iOS
    sources:
      - path: TDSPApp
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.thedailysportspage.app
        PRODUCT_NAME: The Daily Sports Page
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: The Daily Sports Page
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.sports
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        TARGETED_DEVICE_FAMILY: "1,2"
        SUPPORTS_MACCATALYST: NO
    scheme:
      testTargets:
        - TDSPAppTests
  TDSPAppTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: TDSPAppTests
    dependencies:
      - target: TDSPApp
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.thedailysportspage.app.tests
        GENERATE_INFOPLIST_FILE: YES
