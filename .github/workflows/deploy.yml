name: Deploy The Daily Sportz Page

on:
  push:
    branches: [main]
  schedule:
    - cron: "15 10 * * *"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: thedailysportspage-production
  cancel-in-progress: false

jobs:
  deploy:
    if: vars.DAILY_SPORTS_PAGE_DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    env:
      AWS_REGION: us-east-1
      SITE_BUCKET: thedailysportspage-com-716418748259
      CLOUDFRONT_DISTRIBUTION_ID: ${{ vars.DAILY_SPORTS_PAGE_CLOUDFRONT_ID }}
      AI_PROVIDER: openai
      AI_MODEL: gpt-5-mini
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      CLOUDFLARE_WEB_ANALYTICS_TOKEN: ${{ vars.CLOUDFLARE_WEB_ANALYTICS_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Resolve edition date
        id: edition
        run: echo "date=$(TZ=America/New_York date -d 'yesterday' +%F)" >> "$GITHUB_OUTPUT"

      - name: Restore daily LLM enrichment
        uses: actions/cache@v4
        with:
          path: build/ai-cache
          key: sportzpage-lead-${{ steps.edition.outputs.date }}

      - name: Reuse the already published daily lead
        run: |
          curl -fsS \
            https://thedailysportspage.com/subscriber/current/edition.json \
            -o /tmp/current-edition.json || true
          curl -fsS \
            https://thedailysportspage.com/subscriber/current/football/edition.json \
            -o /tmp/current-football-edition.json || true
          python scripts/seed_lead_cache.py \
            /tmp/current-edition.json \
            --game-date "${{ steps.edition.outputs.date }}" \
            --football-edition /tmp/current-football-edition.json

      - name: Install generator
        run: python -m pip install .

      - name: Generate Baseball and Football editions
        run: |
          EDITION_DATE="${{ steps.edition.outputs.date }}"
          daily-sports-page run --date "$EDITION_DATE" --build-dir build
          python -m src.football.generator --date "$EDITION_DATE" --build-dir build/football

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::716418748259:role/thedailysportspage-github-deploy
          aws-region: ${{ env.AWS_REGION }}

      - name: Restore previous current edition and free archive
        run: |
          mkdir -p previous-site/subscriber/current previous-site/archive
          aws s3 sync "s3://${SITE_BUCKET}/subscriber/current" previous-site/subscriber/current
          aws s3 sync "s3://${SITE_BUCKET}/archive" previous-site/archive

      - name: Assemble subscription-ready site artifact
        run: |
          python scripts/assemble_subscription_site.py \
            --previous-site previous-site \
            --output dist

      - name: Publish versioned site artifact
        run: |
          aws s3 sync dist "s3://${SITE_BUCKET}" \
            --delete \
            --exclude "*.html" \
            --exclude "*.json" \
            --cache-control "public,max-age=3600"
          aws s3 sync dist "s3://${SITE_BUCKET}" \
            --delete \
            --exclude "*" \
            --include "*.html" \
            --include "*.json" \
            --cache-control "public,max-age=60,must-revalidate"
          aws cloudfront create-invalidation \
            --distribution-id "$CLOUDFRONT_DISTRIBUTION_ID" \
            --paths "/*"
